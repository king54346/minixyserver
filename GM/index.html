<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小妖怪 GM 工具</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 "Microsoft YaHei", sans-serif; background: #f3f4f6; color: #1f2937; }
  header { background: #1f2937; color: #fff; padding: 10px 16px; display: flex; gap: 12px; align-items: center; }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  main { display: grid; grid-template-columns: 330px 1fr; gap: 12px; padding: 12px; }
  section { background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  h2 { font-size: 15px; margin: 0 0 8px; }
  input, select, textarea, button { font: inherit; padding: 4px 8px; border: 1px solid #d1d5db; border-radius: 4px; }
  button { background: #2563eb; color: #fff; border-color: #2563eb; cursor: pointer; }
  button.gray { background: #6b7280; border-color: #6b7280; }
  button.red { background: #dc2626; border-color: #dc2626; }
  button:disabled { opacity: .5; cursor: default; }
  a.btnlink { font: inherit; padding: 4px 10px; border: 1px solid #374151; border-radius: 4px;
    background: #374151; color: #fff; text-decoration: none; white-space: nowrap; }
  a.btnlink:hover { background: #4b5563; border-color: #4b5563; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 4px 6px; border-bottom: 1px solid #eee; text-align: left; }
  tr.sel { background: #dbeafe; }
  tbody tr { cursor: pointer; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 12px; }
  .grid label { display: flex; flex-direction: column; font-size: 12px; color: #6b7280; }
  .muted { color: #6b7280; font-size: 12px; }
  .online { color: #16a34a; }
  #log { white-space: pre-wrap; font-size: 12px; max-height: 160px; overflow: auto; background: #111827; color: #d1d5db; padding: 8px; border-radius: 6px; }
  #players { max-height: 70vh; overflow: auto; }
  #catalogList { max-height: 200px; overflow: auto; border: 1px solid #eee; }
  #catalogList div { padding: 2px 6px; cursor: pointer; }
  #catalogList div:hover { background: #eff6ff; }
</style>
</head>
<body>
<div style="padding:8px 20px"><a href="/game-rules.html" target="_blank">玩法配置：注册／次数／价格／商店／兑换／奖励／神通</a></div>
<header>
  <h1>小妖怪 GM 工具</h1>
  <a class="btnlink" href="/box.html" target="_blank" rel="noopener">宝箱掉落 ↗</a>
  <a class="btnlink" href="/operations.html" target="_blank" rel="noopener">运营配置 ↗</a>
  <a class="btnlink" href="/accounts.html" target="_blank" rel="noopener">账号管理 ↗</a>
  <a class="btnlink" href="/pets.html" target="_blank" rel="noopener">护法培养 ↗</a>
  <a class="btnlink" href="/dongfu.html" target="_blank" rel="noopener">洞府建筑 ↗</a>
  <a class="btnlink" href="/xiuwei.html" target="_blank" rel="noopener">修炼 ↗</a>
  <a class="btnlink" href="/progress.html" target="_blank" rel="noopener">关卡进度 ↗</a>
  <a class="btnlink" href="/bag.html" target="_blank" rel="noopener">物品栏 ↗</a>
  <a class="btnlink" href="/broadcast.html" target="_blank" rel="noopener">全服播报 ↗</a>
  <span id="status" class="muted">未连接</span>
  <input id="pwd" type="password" placeholder="服务器 root 密码">
  <button id="btnConnect">连接</button>
  <span id="modeTip" class="muted"></span>
</header>
<main>
  <section>
    <h2>玩家 <span id="onlineCount" class="muted">在线 —</span> <button class="gray" id="btnRefresh">刷新</button></h2>
    <div class="row">
      <input id="filter" placeholder="按名字 / uid 筛选" style="flex:1;min-width:0">
      <select id="onlineFilter" aria-label="在线状态"><option value="">全部</option><option value="online">在线</option><option value="offline">离线</option></select>
    </div>
    <div class="row"><span id="checkedCount" class="muted">已勾选 0 人</span><button id="clearChecked" class="gray">清空勾选</button></div>
    <div id="players"><table><thead><tr><th><input id="checkVisible" type="checkbox" aria-label="勾选当前筛选结果"></th><th>uid</th><th>名字</th><th>等级</th><th>状态</th></tr></thead><tbody></tbody></table></div>
  </section>
  <div style="display:flex;flex-direction:column;gap:12px">
    <section>
      <h2>角色数值 <span id="selName" class="muted"></span></h2>
      <div class="grid" id="roleForm"></div>
      <div class="row">
        <button id="btnSave">保存修改</button>
        <button class="gray" id="btnKick">踢下线</button>
        <button class="red" id="btnPerfect">改成完美账号</button>
        <span id="bagInfo" class="muted"></span>
        <a id="roleRecords" target="_blank" rel="noopener" hidden>查看角色战报 ↗</a>
      </div>
      <div class="muted">踢下线可勾选一名玩家，或点击玩家行选中。保存修改 / 完美账号会先把在线的玩家踢下线。完美账号会整体替换护法、装备、法术书。</div>
    </section>
    <section>
      <h2>发放物品（邮件）</h2>
      <div class="row">
        <label>发给 <select id="mailTo"><option value="sel">已勾选的玩家</option><option value="all">全服所有角色</option></select></label>
        <span id="mailRecipients" class="muted"></span>
        <input id="mailTitle" placeholder="标题" value="GM 发放" style="width:160px">
        <input id="mailText" placeholder="正文" value="请查收。" style="flex:1">
      </div>
      <div class="row">
        <label>元宝 <input id="mailGold" type="number" min="0" value="0" style="width:100px"></label>
        <label>银两 <input id="mailCash" type="number" min="0" value="0" style="width:100px"></label>
        <label>魂值 <input id="mailSoul" type="number" min="0" value="0" style="width:100px"></label>
      </div>
      <div class="row">
        <select id="catKind">
          <option value="">全部</option>
          <optgroup label="道具">
            <option value="道具||">全部道具</option>
            <option value="道具|礼包|">礼包</option>
          </optgroup>
          <optgroup label="装备">
            <option value="装备||">全部装备</option>
            <option value="装备|鞋子|">鞋子</option>
          </optgroup>
          <optgroup label="装备 · 武器">
            <option value="装备|武器|">全部武器</option>
            <option value="装备|武器|5">5星武器</option>
            <option value="装备|武器|4">4星武器</option>
            <option value="装备|武器|3">3星武器</option>
          </optgroup>
          <optgroup label="装备 · 铠甲">
            <option value="装备|铠甲|">全部铠甲</option>
            <option value="装备|铠甲|5">5星铠甲</option>
            <option value="装备|铠甲|4">4星铠甲</option>
            <option value="装备|铠甲|3">3星铠甲</option>
          </optgroup>
          <optgroup label="法术书">
            <option value="法术书||">全部法术书</option>
            <option value="法术书||5">5星法术书</option>
            <option value="法术书||4">4星法术书</option>
            <option value="法术书||3">3星法术书</option>
          </optgroup>
          <optgroup label="护法">
            <option value="护法||">全部护法</option>
            <option value="护法||5">5星护法</option>
            <option value="护法||4">4星护法</option>
            <option value="护法||3">3星护法</option>
          </optgroup>
        </select>
        <input id="catSearch" placeholder="搜物品名 / 编号（如 甘露、WP10238）" style="flex:1">
      </div>
      <div id="catalogList"></div>
      <table id="mailItems"><thead><tr><th>编号</th><th>名称</th><th>数量</th><th></th></tr></thead><tbody></tbody></table>
      <div class="row"><button id="btnMail">发送邮件</button></div>
    </section>
    <section><h2>日志</h2><div id="log"></div></section>
  </div>
</main>
<script>
const ROLE_FIELDS = [["gold","元宝"],["cash","银两"],["soulexp","魂值"],["friendpoint","友情点"],["grade","等级"],
  ["exp","经验"],["vip","VIP"],["tpoint","体力"],["hpoint","活力"],["stop_upgrade","停级(0/1)"],["xgrade","巅峰等级"],["xiuwei","巅峰经验"]];
let players = [], catalog = [], sel = null, original = {}, mailItems = {};
const checked = new Set();

const $ = id => document.getElementById(id);
function log(msg, bad) {
  const t = new Date().toLocaleTimeString();
  $("log").textContent = `[${t}] ${bad ? "✗ " : ""}${msg}\n` + $("log").textContent;
}
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (!r.ok || j.error) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}
const nameOf = code => (catalog.find(c => c.code === code) || {}).name || code;

// 装备细分（来自 suit.csv 的 kind）：武器 / 铠甲 / 鞋子；道具按名字含“礼包”另分出礼包。仅用于页面筛选，不改动游戏数据。
const SUIT_SUB_RANGES = [[1001, 1055, "武器"], [1056, 1112, "铠甲"], [1143, 1143, "武器"],
  [1145, 1145, "武器"], [1501, 1511, "鞋子"], [2001, 2004, "武器"]];
function subOf(c) {
  if (c.kind === "道具") return c.name.includes("礼包") ? "礼包" : ""; // 道具里按名字含“礼包”分成礼包
  if (c.kind !== "装备") return "";
  const id = Number(c.code.slice(2));
  for (const [a, b, name] of SUIT_SUB_RANGES) if (id >= a && id <= b) return name;
  return "";
}

$("btnConnect").onclick = async () => {
  try {
    const j = await api("/api/connect", {password: $("pwd").value});
    $("pwd").value = "";
    $("status").textContent = "已连接 " + j.host;
    log("已连接服务器 " + j.host + (j.mode === "direct" ? "（直连模式）" : "（隧道模式）"));
    await loadPlayers();
    catalog = await api("/api/catalog");
    renderCatalog();
  } catch (e) { log(e.message, true); }
};
$("pwd").onkeydown = e => { if (e.key === "Enter") $("btnConnect").click(); };

async function loadPlayers() {
  players = await api("/api/players") || [];
  const available = new Set(players.map(p => p.uid));
  for (const uid of checked) if (!available.has(uid)) checked.delete(uid);
  renderPlayers();
}
$("btnRefresh").onclick = () => loadPlayers().catch(e => log(e.message, true));
$("filter").oninput = renderPlayers;
$("onlineFilter").onchange = renderPlayers;
$("clearChecked").onclick = () => { checked.clear(); renderPlayers(); };
$("mailTo").onchange = renderSelection;
function visiblePlayers() {
  const f = $("filter").value.trim();
  const online = $("onlineFilter").value;
  return players.filter(p => (!f || String(p.uid).includes(f) || (p.name || "").includes(f)) &&
    (!online || Boolean(p.online) === (online === "online")));
}
$("checkVisible").onchange = e => {
  for (const p of visiblePlayers()) {
    if (e.target.checked) checked.add(p.uid);
    else checked.delete(p.uid);
  }
  renderPlayers();
};
function renderSelection() {
  const visible = visiblePlayers();
  const marked = visible.filter(p => checked.has(p.uid)).length;
  $("checkVisible").checked = marked > 0 && marked === visible.length;
  $("checkVisible").indeterminate = marked > 0 && marked < visible.length;
  $("checkVisible").disabled = visible.length === 0;
  $("checkedCount").textContent = `已勾选 ${checked.size} 人`;
  $("mailRecipients").textContent = $("mailTo").value === "all" ? "" :
    checked.size ? `${checked.size} 位收件人` : sel ? `当前角色 uid ${sel}` : "请勾选收件人";
}
function renderPlayers() {
  $("onlineCount").textContent = `在线 ${players.filter(p => p.online).length} / ${players.length}`;
  const tb = $("players").querySelector("tbody");
  tb.innerHTML = "";
  for (const p of visiblePlayers()) {
    const tr = document.createElement("tr");
    if (sel === p.uid) tr.className = "sel";
    tr.innerHTML = `<td><input type="checkbox"></td><td>${p.uid}</td><td></td><td>${p.grade}</td><td class="online">${p.online ? "在线" : "离线"}</td>`;
    tr.children[2].textContent = p.name;
    const box = tr.querySelector("input");
    box.setAttribute("aria-label", `勾选 ${p.name} (${p.uid})`);
    box.checked = checked.has(p.uid);
    box.onclick = e => e.stopPropagation();
    box.onchange = () => {
      if (box.checked) checked.add(p.uid);
      else checked.delete(p.uid);
      renderSelection();
    };
    tr.onclick = () => selectPlayer(p.uid);
    tb.appendChild(tr);
  }
  renderSelection();
}

let selectionRequest = 0;
async function selectPlayer(uid) {
  const request = ++selectionRequest;
  try {
    const j = await api("/api/player?uid=" + uid);
    if (request !== selectionRequest) return;
    sel = uid;
    $("roleRecords").href = "/records.html?" + new URLSearchParams({uid});
    $("roleRecords").hidden = false;
    original = {};
    const ro = j.role;
    $("selName").textContent = `${ro.name}（uid ${ro.uid}${j.online ? "，在线" : ""}）`;
    const form = $("roleForm");
    form.innerHTML = "";
    for (const [k, label] of ROLE_FIELDS) {
      const v = (k === "friendpoint" ? ro.friend_point : ro[k]) ?? 0; // 角色存档里友情点的键是 friend_point
      original[k] = v;
      const l = document.createElement("label");
      l.innerHTML = `${label}<input type="number" min="0" data-k="${k}">`;
      l.querySelector("input").value = v;
      form.appendChild(l);
    }
    $("bagInfo").textContent = `护法 ${j.pets ?? "-"}  装备 ${j.suits ?? "-"}  法术书 ${j.books ?? "-"}  道具格 ${j.items ?? "-"}`;
    renderPlayers();
  } catch (e) { log(e.message, true); }
}

$("btnSave").onclick = async () => {
  if (!sel) return log("先选一个玩家", true);
  const set = {};
  for (const inp of $("roleForm").querySelectorAll("input")) {
    const v = Number(inp.value);
    if (v !== original[inp.dataset.k]) set[inp.dataset.k] = v;
  }
  if (!Object.keys(set).length) return log("没有改动");
  try {
    await api("/api/role", {uid: sel, set});
    log(`uid ${sel} 已修改：${JSON.stringify(set)}`);
    await selectPlayer(sel);
    loadPlayers();
  } catch (e) { log(e.message, true); }
};
$("btnKick").onclick = async () => {
  if (checked.size > 1) return log("踢下线一次只能处理一名玩家，请只勾选一人", true);
  const uid = checked.size === 1 ? checked.values().next().value : sel;
  if (!uid) return log("请勾选一名玩家或点击玩家行", true);
  const button = $("btnKick");
  button.disabled = true;
  try {
    await api("/api/kick", {uid});
    log(`uid ${uid} 已踢下线`);
    await loadPlayers();
    if (sel === uid) await selectPlayer(uid);
  } catch (e) {
    log(e.message, true);
  } finally {
    button.disabled = false;
  }
};
$("btnPerfect").onclick = async () => {
  if (!sel) return log("先选一个玩家", true);
  if (!confirm(`把 uid ${sel} 改成完美账号？原有护法、装备、法术书会被整体替换。`)) return;
  try { const j = await api("/api/perfect", {uid: sel}); log(`uid ${j.uid} 已改成完美账号`); selectPlayer(sel); loadPlayers(); }
  catch (e) { log(e.message, true); }
};

$("catSearch").oninput = renderCatalog;
$("catKind").onchange = renderCatalog;
function renderCatalog() {
  const q = $("catSearch").value.trim().toUpperCase();
  const [kind, sub, star] = $("catKind").value.split("|"); // 值形如 装备|武器|5；不选的段留空
  const box = $("catalogList");
  box.innerHTML = "";
  // 同一类别内按星级从高到低（5★ → 4★ → 3★）；道具没有星级，保持原顺序
  const pos = new Map(catalog.map((c, i) => [c, i]));
  const list = [...catalog].sort((a, b) => a.kind === b.kind
    ? ((b.star ?? 0) - (a.star ?? 0)) || pos.get(a) - pos.get(b)
    : pos.get(a) - pos.get(b));
  for (const c of list) {
    if (kind && c.kind !== kind) continue;
    // 装备 / 法术书 / 护法不再发放 1 星、2 星
    if ((c.kind === "装备" || c.kind === "法术书" || c.kind === "护法") && (c.star ?? 0) < 3) continue;
    if (sub && subOf(c) !== sub) continue;
    if (star && (c.star ?? 0) !== Number(star)) continue;
    if (q && !c.code.includes(q) && !c.name.toUpperCase().includes(q)) continue;

    const d = document.createElement("div");
    d.textContent = `${c.code}  ${c.name}  [${c.kind}${c.star ? " " + c.star + "星" : ""}]`;
    d.onclick = () => { mailItems[c.code] = (mailItems[c.code] || 0) + 1; renderMailItems(); };
    box.appendChild(d);
  }
}
function renderMailItems() {
  const tb = $("mailItems").querySelector("tbody");
  tb.innerHTML = "";
  for (const [code, n] of Object.entries(mailItems)) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${code}</td><td></td><td><input type="number" min="1" style="width:90px"></td><td><button class="gray">移除</button></td>`;
    tr.children[1].textContent = nameOf(code);
    const inp = tr.querySelector("input");
    inp.value = n;
    inp.onchange = () => { mailItems[code] = Math.max(1, Number(inp.value) || 1); };
    tr.querySelector("button").onclick = () => { delete mailItems[code]; renderMailItems(); };
    tb.appendChild(tr);
  }
}
$("btnMail").onclick = async () => {
  const all = $("mailTo").value === "all";
  const recipients = checked.size ? [...checked] : sel ? [sel] : [];
  if (!all && recipients.length === 0) return log("先勾选收件人，或选择发给全服", true);
  const body = {to: all ? 0 : recipients.length > 1 ? -1 : recipients[0], title: $("mailTitle").value, text: $("mailText").value,
    gold: Number($("mailGold").value) || 0, cash: Number($("mailCash").value) || 0, soul: Number($("mailSoul").value) || 0,
    items: mailItems};
  if (!body.gold && !body.cash && !body.soul && !Object.keys(mailItems).length) return log("没有要发的东西", true);
  if (all && !confirm("确定发给全服所有角色？")) return;
  if (!all && recipients.length > 1) {
    if (!confirm(`确定向勾选的 ${recipients.length} 位角色发邮件？`)) return;
    body.uids = recipients;
  }
  $("btnMail").disabled = true;
  try {
    const j = await api("/api/mail", body);
    log(`已发送 ${j.sent} 封邮件（${all ? "全服" : "uid " + recipients.join(", ")}）：${JSON.stringify(body.items)} 元宝${body.gold} 银两${body.cash} 魂值${body.soul}`);
    mailItems = {};
    renderMailItems();
  } catch (e) { log(e.message, true); }
  finally { $("btnMail").disabled = false; }
};

api("/api/status").then(j => {
  if (j.mode === "direct") {
    // 直连模式：不需要 root 密码，页面自己会经本机 28418（SSH 隧道）访问管理接口
    $("pwd").style.display = "none";
    $("btnConnect").style.display = "none";
    $("modeTip").textContent = "直连 " + j.admin;
    $("status").textContent = j.connected ? "已连接 " + j.admin : "未连接（连不上 " + j.admin + "）";
  } else if (j.mode === "tunnel") {
    $("modeTip").textContent = "隧道模式 " + j.host;
  }
  if (j.connected) { $("status").textContent = "已连接 " + (j.mode === "direct" ? j.admin : j.host); loadPlayers(); api("/api/catalog").then(c => { catalog = c; renderCatalog(); }); }
}).catch(() => {});
</script>
</body>
</html>
